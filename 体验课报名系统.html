<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>体验课报名</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app">
    <section id="view-poster" class="view">
      <header class="page-head">
        <svg class="binding" viewBox="0 0 20 300" preserveAspectRatio="none" aria-hidden="true">
          <g fill="none" stroke="#2F6BFF" stroke-width="2.4" stroke-linecap="round" opacity="0.85">
            <rect x="3" y="6" width="14" height="11" rx="5.5"/>
            <rect x="3" y="36" width="14" height="11" rx="5.5"/>
            <rect x="3" y="66" width="14" height="11" rx="5.5"/>
            <rect x="3" y="96" width="14" height="11" rx="5.5"/>
            <rect x="3" y="126" width="14" height="11" rx="5.5"/>
            <rect x="3" y="156" width="14" height="11" rx="5.5"/>
            <rect x="3" y="186" width="14" height="11" rx="5.5"/>
            <rect x="3" y="216" width="14" height="11" rx="5.5"/>
            <rect x="3" y="246" width="14" height="11" rx="5.5"/>
            <rect x="3" y="276" width="14" height="11" rx="5.5"/>
          </g>
        </svg>
        <div class="doodle-layer" aria-hidden="true">
          <span class="doodle doodle-1"><svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6-5.4-2.9L6.6 19.5l1.2-6L3.3 9.3l6.1-.7z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg></span>
          <span class="doodle doodle-2"><svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 3.5c.6 3.4 1.6 4.4 5 5-3.4.6-4.4 1.6-5 5-.6-3.4-1.6-4.4-5-5 3.4-.6 4.4-1.6 5-5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg></span>
          <span class="doodle doodle-3"><svg viewBox="0 0 40 26" xmlns="http://www.w3.org/2000/svg"><path d="M11 20h17c3.8 0 6.5-2.2 6.5-5.2S32 9.6 28.6 9.6c-.7-3.4-3.6-5.6-7-5.6-3.6 0-6.6 2.4-7.2 5.8-3 .2-5.4 2.2-5.4 5 0 3 2 5.2 2 5.2z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg></span>
          <span class="doodle doodle-4"><svg viewBox="0 0 30 30" xmlns="http://www.w3.org/2000/svg"><path d="M5 25l1.6-5.2 13-13 3.6 3.6-13 13z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M19.6 6.8l3.6 3.6 2-2a1.3 1.3 0 0 0 0-1.8l-1.8-1.8a1.3 1.3 0 0 0-1.8 0z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg></span>
          <span class="doodle doodle-5"><svg viewBox="0 0 26 30" xmlns="http://www.w3.org/2000/svg"><path d="M4 6.5A2.5 2.5 0 0 1 6.5 4H21v22H6.5A2.5 2.5 0 0 0 4 28.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M9 10h8M9 14.5h6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></span>
          <span class="doodle doodle-6"><svg viewBox="0 0 26 24" xmlns="http://www.w3.org/2000/svg"><path d="M2.5 11 23 3l-7.5 18-3.8-7.4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M11.7 13.6 23 3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></span>
          <span class="doodle doodle-7 doodle-leaf"><svg viewBox="0 0 22 24" xmlns="http://www.w3.org/2000/svg"><path d="M3.5 20.5C3.5 10.5 10.5 3.5 19 3c0 9.5-6.5 17.5-15.5 17.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M3.5 20.5 19 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></span>
          <span class="doodle doodle-8"><svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="12" r="6" fill="none" stroke="currentColor" stroke-width="1.8"/><ellipse cx="12" cy="12" rx="10.5" ry="3.6" fill="none" stroke="currentColor" stroke-width="1.6" transform="rotate(-18 12 12)"/></svg></span>
        </div>
        <div class="hero-main">
          <div class="hero-text">
            <span class="hero-label">
              <svg class="hero-clip" viewBox="0 0 20 36" aria-hidden="true"><path d="M6 30V11a5 5 0 0 1 10 0v16a4 4 0 0 1-8 0V15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
              XXX教育 · 0 元体验课
            </span>
            <h1 class="site-title">
              <span class="title-l1">XXX体验课</span>
              <span class="title-l2">报名啦！</span>
            </h1>
          </div>
          <img class="hero-art" src="images/hero-kids.png" alt="背着书包、举着铅笔的小学生" width="341" height="512">
        </div>
        <p class="hero-ribbon">多学科体验 · 可视化反馈 · 课后延续</p>
        <ul class="hero-facts">
          <li><b>11</b>门学科可选</li>
          <li><b>5</b>分钟家长沟通</li>
          <li><b>1</b>页学情反馈</li>
        </ul>
      </header>

      <section class="module-card">
        <div class="module-head">
          <h2 class="module-title"><span class="module-icon"><svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M4 5a2 2 0 0 1 2-2h12a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H6a2 2 0 0 1-2-2z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 7h8M8 11h8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span>课程特色</h2>
          <a class="link-more" href="#/detail/course">详细了解→</a>
        </div>
        <div class="feature-list" id="feature-list"></div>
      </section>

      <section class="module-card">
        <div class="module-head">
          <h2 class="module-title"><span class="module-icon"><svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M2 9 12 4l10 5-10 5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M6 11v5c0 1.5 2.7 3 6 3s6-1.5 6-3v-5" fill="none" stroke="currentColor" stroke-width="2"/></svg></span>师资力量</h2>
          <a class="link-more" href="#/detail/teachers">详细了解→</a>
        </div>
        <div class="teacher-grid" id="teacher-grid"></div>
      </section>

      <section class="module-card">
        <div class="module-head">
          <h2 class="module-title"><span class="module-icon"><svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 2l2.7 5.8 6.3.8-4.6 4.4 1.2 6.3-5.6-3-5.6 3 1.2-6.3L3 8.6l6.3-.8z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></span>往期学员成果</h2>
          <a class="link-more" href="#/detail/works">详细了解→</a>
        </div>
        <div class="work-grid" id="work-grid"></div>
      </section>

      <div class="cta-wrap cta-bar">
        <a class="btn-primary" href="#/register">立即报名</a>
      </div>
    </section>

    <section id="view-detail" class="view">
      <header class="detail-head">
        <a class="btn-back" href="#/">‹ 返回</a>
        <h1 class="page-title" id="detail-title">课程特色</h1>
      </header>
      <div class="detail-body" id="detail-body">内容待更新</div>
    </section>

    <section id="view-register" class="view">
      <header class="detail-head">
        <a class="btn-back" href="#/">‹ 返回</a>
        <h1 class="page-title">体验课报名</h1>
      </header>

      <div class="form-group">
        <label class="form-label">家长姓名</label>
        <div id="parent-rows"></div>
        <button type="button" class="btn-add" id="add-parent">添加家长</button>
      </div>

      <div class="form-group">
        <label class="form-label">孩子姓名、年级与感兴趣的课程</label>
        <div id="child-rows"></div>
        <button type="button" class="btn-add" id="add-child">添加孩子</button>
      </div>

      <div class="form-group">
        <label class="form-label">家长手机号</label>
        <div class="phone-row">
          <input type="text" inputmode="numeric" id="phone" placeholder="12345678910" maxlength="11" autocomplete="off">
          <button type="button" class="btn-code" id="send-code">发送验证码</button>
        </div>
        <div class="field-error" id="phone-error"></div>
      </div>

      <div class="form-group">
        <label class="form-label">验证码（请写出正确的四位数字验证码）</label>
        <input type="text" inputmode="numeric" id="code" placeholder="请输入4位验证码" maxlength="4" autocomplete="off">
        <div class="field-error" id="code-error"></div>
      </div>

      <div class="cta-wrap">
        <button type="button" class="btn-primary" id="submit" disabled>立即报名</button>
      </div>
    </section>

    <section id="view-result" class="view">
      <header class="detail-head">
        <h1 class="page-title">报名结果</h1>
      </header>
      <div class="result-red" id="result-red">信息已收到
报名结果将在24小时内通过电话或短信通知</div>
      <div class="video-placeholder" id="video-placeholder">往期家长或学生的课程或采访视频</div>
      <div class="wechat-line" id="wechat-line">若需第一时间确定报名结果或了解详情请添加课程微信：12345678910</div>
      <div class="result-actions">
        <button type="button" class="btn-primary" id="btn-known">我已知悉</button>
        <button type="button" class="btn-secondary" id="btn-unknown">未知悉</button>
      </div>
      <div class="result-feedback" id="result-feedback"></div>
      <div class="result-save-status" id="result-save-status"></div>
    </section>
  </div>

  <script src="js/data.js"></script>
  <script src="js/validate.js"></script>
  <script src="js/countdown.js"></script>
  <script src="js/form-state.js"></script>
  <script src="js/illustrations.js"></script>
  <script src="js/config.js"></script>
  <script src="js/backend.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
